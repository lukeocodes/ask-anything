services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ask
      POSTGRES_PASSWORD: ask
      POSTGRES_DB: ask
    ports:
      - "5432:5432"
    volumes:
      - ask_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ask -d ask"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ask_pgdata:
